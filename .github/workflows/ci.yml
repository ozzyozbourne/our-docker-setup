name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: docker/setup-buildx-action@v4
      - name: Build the app image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only on main, and only once the GCP and Tailscale settings exist
  # (repository variable GCP_PROJECT_ID set), so the public repo stays green before that.
  deploy:
    needs: check
    if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ouramp
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Push the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/app:${{ github.sha }}
          cache-from: type=gha
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over Tailscale SSH
        env:
          VM: ${{ vars.VM_SSH_USER }}@${{ vars.VM_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$VM" mkdir -p ouramp/postgres ouramp/alloy ouramp/pgadmin
          scp docker-compose.yml "$VM":ouramp/
          scp postgres/init.sh "$VM":ouramp/postgres/
          scp alloy/config.alloy "$VM":ouramp/alloy/
          scp pgadmin/servers.json "$VM":ouramp/pgadmin/
          ssh "$VM" "cd ouramp && export APP_IMAGE=$REGISTRY/app IMAGE_TAG=${{ github.sha }} && docker compose pull && docker compose up -d --no-build --remove-orphans"
