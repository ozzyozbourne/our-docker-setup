name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ouramp-app
  PUSH: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: docker/setup-buildx-action@v4
      # On main, the image is also pushed to GitHub Container Registry (public, like the repo).
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the app image (pushed on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only on main, and only once the VM and Tailscale settings exist
  # (repository variable VM_HOST set), so the public repo stays green before that.
  deploy:
    needs: check
    if: github.event_name == 'push' && vars.VM_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over Tailscale SSH
        env:
          VM: ${{ vars.VM_SSH_USER }}@${{ vars.VM_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$VM" mkdir -p ouramp/postgres ouramp/alloy ouramp/pgadmin
          scp docker-compose.yml "$VM":ouramp/
          scp postgres/init.sh "$VM":ouramp/postgres/
          scp alloy/config.alloy "$VM":ouramp/alloy/
          scp pgadmin/servers.json "$VM":ouramp/pgadmin/
          ssh "$VM" "cd ouramp && export APP_IMAGE=$IMAGE IMAGE_TAG=${{ github.sha }} && docker compose pull && docker compose up -d --no-build --remove-orphans"
