# The whole backend on one machine. Every published port is bound to 127.0.0.1;
# Tailscale Funnel on the host makes 3000 (app), 4318 (Alloy) and 3001 (portal) public.
name: ouramp

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      RIVET_DB_PASSWORD: ${RIVET_DB_PASSWORD:?set in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  rivet-engine:
    image: rivetdev/engine:full-2.3.30
    restart: unless-stopped
    environment:
      RIVET__POSTGRES__URL: postgres://rivet:${RIVET_DB_PASSWORD}@postgres:5432/rivet
      RIVET__AUTH__ADMIN_TOKEN: ${RIVET_ADMIN_TOKEN:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6421/health"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 30s

  app:
    image: ${APP_IMAGE:-ouramp-app}:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@postgres:5432/app
      RIVET_ENDPOINT: http://rivet-engine:6420
      RIVET_TOKEN: ${RIVET_ADMIN_TOKEN}
      RIVET_HEALTH_URL: http://rivet-engine:6421
      ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      OTEL_SERVICE_NAME: ouramp-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${ALLOY_OTLP_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      rivet-engine:
        condition: service_healthy

  alloy:
    image: grafana/alloy:v1.21.2
    restart: unless-stopped
    # --stability.level is only for the debug exporter; drop it once the real exporters are in
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--stability.level=experimental", "/etc/alloy/config.alloy"]
    environment:
      ALLOY_OTLP_TOKEN: ${ALLOY_OTLP_TOKEN:?set in .env}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - 127.0.0.1:4318:4318

  backup:
    image: ${BACKUP_IMAGE:-ouramp-backup}:${IMAGE_TAG:-local}
    build: ./backup
    restart: unless-stopped
    profiles: [backup] # off until the R2 keys are in .env: docker compose --profile backup up -d
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
